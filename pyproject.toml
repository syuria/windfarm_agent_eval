[project]
name = "windwatch-mini"
version = "0.1.0"
description = "Minimal wind turbine anomaly detection codebase for agent evaluation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.2"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
